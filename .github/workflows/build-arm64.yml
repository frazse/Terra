name: Build ARM64 AppImage

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libglib2.0-dev \
            libssl-dev \
            libdbus-1-dev \
            libudev-dev \
            fuse3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Backend
        run: cargo build --release

      - name: Build Electron ARM64 AppImage
        run: |
          cd electron
          npm install
          npm run dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Terra-Linux-ARM64-AppImage
          path: electron/dist/*.AppImage
